<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon historique - WebQuiz</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc 45%,
                    #e0f2fe
                );

            color: #0f172a;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .page {
            width: 100%;
            min-height: 100vh;

            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;
        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }


        .logo {
            display: flex;

            align-items: center;
            gap: 10px;

            font-size: 25px;
            font-weight: 800;

            color: #4f46e5;
        }


        .logo-icon {
            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #4f46e5;

            color: white;

            font-size: 23px;

            box-shadow:
                0 8px 20px rgba(
                    79,
                    70,
                    229,
                    0.25
                );
        }


        /* =====================================================
           USER BUTTON
        ===================================================== */

        .user-button {
            display: flex;

            align-items: center;
            gap: 10px;

            padding: 10px 15px;

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            font-weight: 600;

            color: #334155;
        }


        .user-avatar {
            width: 35px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;

            color: #4f46e5;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            position: relative;

            overflow: hidden;

            padding: 35px;

            margin-bottom: 25px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #6366f1,
                    #7c3aed
                );

            color: white;

            box-shadow:
                0 20px 40px rgba(
                    79,
                    70,
                    229,
                    0.20
                );
        }


        .hero::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -70px;
            top: -80px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.10);
        }


        .hero h1 {
            position: relative;
            z-index: 1;

            font-size: 32px;

            margin-bottom: 10px;
        }


        .hero p {
            position: relative;
            z-index: 1;

            color: #e0e7ff;

            font-size: 16px;
        }


        /* =====================================================
           STATISTIQUES
        ===================================================== */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }


        .stat-card {
            padding: 20px;

            background: white;

            border:
                1px solid #e2e8f0;

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(
                    15,
                    23,
                    42,
                    0.05
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .stat-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(
                    15,
                    23,
                    42,
                    0.08
                );
        }


        .stat-icon {
            font-size: 25px;

            margin-bottom: 10px;
        }


        .stat-label {
            font-size: 13px;

            color: #64748b;

            margin-bottom: 5px;
        }


        .stat-value {
            font-size: 27px;

            font-weight: 800;

            color: #0f172a;
        }


        /* =====================================================
           HISTORIQUE HEADER
        ===================================================== */

        .section-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }


        .section-header h2 {
            font-size: 22px;
        }


        .section-header span {
            font-size: 14px;

            color: #64748b;
        }


        /* =====================================================
           HISTORY LIST
        ===================================================== */

        .history-list {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        .history-item {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            padding: 22px;

            background: white;

            border:
                1px solid #e2e8f0;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(
                    15,
                    23,
                    42,
                    0.05
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .history-item:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 30px rgba(
                    15,
                    23,
                    42,
                    0.08
                );
        }


        /* =====================================================
           LEFT
        ===================================================== */

        .history-left {
            display: flex;

            align-items: center;

            gap: 15px;

            min-width: 0;
        }


        .quiz-icon {
            flex-shrink: 0;

            width: 52px;
            height: 52px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: #eef2ff;

            font-size: 24px;
        }


        .history-info {
            min-width: 0;
        }


        .history-quiz {
            font-size: 17px;

            font-weight: 750;

            margin-bottom: 6px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .history-date {
            font-size: 13px;

            color: #94a3b8;
        }


        /* =====================================================
           CENTER
        ===================================================== */

        .history-details {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        .badge {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 7px 11px;

            border-radius: 999px;

            font-size: 13px;

            font-weight: 700;
        }


        .badge-score {
            background: #f0fdf4;

            color: #15803d;
        }


        .badge-correct {
            background: #eff6ff;

            color: #1d4ed8;
        }


        /* =====================================================
           RIGHT SCORE
        ===================================================== */

        .history-right {
            text-align: right;

            flex-shrink: 0;
        }


        .history-score {
            font-size: 23px;

            font-weight: 800;

            color: #0f172a;
        }


        .history-percentage {
            font-size: 13px;

            font-weight: 700;

            color: #4f46e5;

            margin-top: 3px;
        }


        .history-xp {
            margin-top: 5px;

            font-size: 13px;

            font-weight: 700;

            color: #d97706;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty-history {
            padding: 60px 25px;

            background: white;

            border:
                1px solid #e2e8f0;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(
                    15,
                    23,
                    42,
                    0.05
                );
        }


        .empty-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;

            font-size: 38px;
        }


        .empty-history h2 {
            margin-bottom: 8px;
        }


        .empty-history p {
            color: #64748b;

            margin-bottom: 20px;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 30px;
        }


        .button {
            border: none;

            padding: 13px 20px;

            border-radius: 13px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .button:hover {
            transform: translateY(-2px);
        }


        .button-primary {
            background: #4f46e5;

            color: white;

            box-shadow:
                0 8px 20px rgba(
                    79,
                    70,
                    229,
                    0.20
                );
        }


        .button-secondary {
            background: white;

            color: #334155;

            border:
                1px solid #e2e8f0;
        }


        .button-danger {
            background: #fff1f2;

            color: #be123c;

            border:
                1px solid #fecdd3;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            padding: 50px;

            text-align: center;

            color: #64748b;
        }


        .loader {
            width: 35px;
            height: 35px;

            margin: 0 auto 15px;

            border:
                4px solid #e2e8f0;

            border-top-color: #4f46e5;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }


            .history-item {
                align-items: flex-start;

                flex-direction: column;
            }


            .history-right {
                width: 100%;

                display: flex;

                justify-content: space-between;

                align-items: center;

                text-align: left;

                padding-top: 10px;

                border-top:
                    1px solid #f1f5f9;
            }

        }


        @media (max-width: 550px) {

            .page {
                padding: 20px 12px;
            }


            .topbar {
                margin-bottom: 20px;
            }


            .logo {
                font-size: 20px;
            }


            .user-button {
                padding: 8px;
            }


            .user-button span {
                display: none;
            }


            .hero {
                padding: 25px 20px;

                border-radius: 20px;
            }


            .hero h1 {
                font-size: 25px;
            }


            .stats {
                gap: 10px;
            }


            .stat-card {
                padding: 15px;
            }


            .stat-value {
                font-size: 23px;
            }


            .history-item {
                padding: 17px;
            }


            .history-left {
                width: 100%;
            }


            .history-quiz {
                max-width: 220px;
            }


            .actions {
                flex-direction: column;
            }


            .button {
                width: 100%;
            }

        }

    </style>
</head>


<body>

<div class="page">

    <div class="container">


        <!-- =================================================
             TOPBAR
        ================================================= -->

        <div class="topbar">

            <div class="logo">

                <div class="logo-icon">
                    🧠
                </div>

                WebQuiz

            </div>


            <div class="user-button">

                <div
                    class="user-avatar"
                    id="userAvatar"
                >
                    👤
                </div>

                <span id="userName">
                    Mon compte
                </span>

            </div>

        </div>



        <!-- =================================================
             HERO
        ================================================= -->

        <div class="hero">

            <h1>
                📚 Mon historique
            </h1>

            <p>
                Retrouve tous tes quiz,
                tes scores et ton expérience gagnée.
            </p>

        </div>



        <!-- =================================================
             STATISTIQUES
        ================================================= -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    🎯
                </div>

                <div class="stat-label">
                    Quiz terminés
                </div>

                <div
                    class="stat-value"
                    id="totalQuiz"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🏆
                </div>

                <div class="stat-label">
                    Meilleur score
                </div>

                <div
                    class="stat-value"
                    id="bestScore"
                >
                    0%
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📊
                </div>

                <div class="stat-label">
                    Moyenne
                </div>

                <div
                    class="stat-value"
                    id="averageScore"
                >
                    0%
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⭐
                </div>

                <div class="stat-label">
                    XP gagnés
                </div>

                <div
                    class="stat-value"
                    id="totalXP"
                >
                    0
                </div>

            </div>

        </div>



        <!-- =================================================
             SECTION HISTORIQUE
        ================================================= -->

        <div class="section-header">

            <h2>
                Tes derniers quiz
            </h2>

            <span id="historyCount">
                0 résultat
            </span>

        </div>



        <div
            id="historyList"
            class="history-list"
        >

            <div class="loading">

                <div class="loader"></div>

                Chargement de ton historique...

            </div>

        </div>



        <!-- =================================================
             ACTIONS
        ================================================= -->

        <div class="actions">

            <button
                class="button button-primary"
                onclick="startQuiz()"
            >
                🎯 Commencer un quiz
            </button>


            <button
                class="button button-secondary"
                onclick="goDashboard()"
            >
                ← Dashboard
            </button>


            <button
                class="button button-danger"
                onclick="logout()"
            >
                🚪 Se déconnecter
            </button>

        </div>

    </div>

</div>



<script>

    /* =====================================================
       AUTHENTIFICATION
    ===================================================== */

    const token =
        localStorage.getItem(
            "webquiz_token"
        );

    const userData =
        localStorage.getItem(
            "webquiz_user"
        );


    if (!token || !userData) {

        window.location.href =
            "login.html";
    }


    let currentUser = null;


    try {

        currentUser =
            JSON.parse(userData);

    } catch (error) {

        localStorage.removeItem(
            "webquiz_token"
        );

        localStorage.removeItem(
            "webquiz_user"
        );

        window.location.href =
            "login.html";
    }



    /* =====================================================
       AFFICHER UTILISATEUR
    ===================================================== */

    if (currentUser) {

        const userName =
            document.getElementById(
                "userName"
            );

        if (userName) {

            userName.textContent =
                currentUser.name;
        }

        const avatar =
            document.getElementById(
                "userAvatar"
            );

        if (avatar) {

            avatar.textContent =
                currentUser.name
                    ? currentUser.name
                        .charAt(0)
                        .toUpperCase()
                    : "👤";
        }
    }



    /* =====================================================
       CALCUL XP
    ===================================================== */

    function calculateXP(score) {

        const percentage =
            Number(
                score.percentage
            ) || 0;


        if (percentage === 100) {
            return 50;
        }


        if (percentage >= 80) {
            return 40;
        }


        if (percentage >= 60) {
            return 30;
        }


        if (percentage >= 40) {
            return 20;
        }


        return 10;
    }



    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(dateString) {

        if (!dateString) {

            return "Date inconnue";
        }


        const date =
            new Date(dateString);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Date inconnue";
        }


        return date.toLocaleString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }



    /* =====================================================
       CHARGER HISTORIQUE
    ===================================================== */

    async function loadHistory() {

        const historyList =
            document.getElementById(
                "historyList"
            );


        try {

            const response =
                await fetch(
                    "http://localhost:3000/scores",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            /* =================================================
               SESSION INVALIDE
            ================================================= */

            if (
                response.status === 401
            ) {

                localStorage.removeItem(
                    "webquiz_token"
                );

                localStorage.removeItem(
                    "webquiz_user"
                );

                window.location.href =
                    "login.html";

                return;
            }


            /* =================================================
               ERREUR
            ================================================= */

            if (!response.ok) {

                historyList.innerHTML = `

                    <div class="empty-history">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Impossible de charger
                        </h2>

                        <p>
                            ${
                                data.message ||
                                "Une erreur est survenue."
                            }
                        </p>

                    </div>

                `;

                return;
            }


            const scores =
                Array.isArray(
                    data.scores
                )
                    ? data.scores
                    : [];


            /* =================================================
               STATISTIQUES
            ================================================= */

            const totalQuiz =
                scores.length;


            const bestScore =
                totalQuiz > 0
                    ? Math.max(
                        ...scores.map(
                            item =>
                                Number(
                                    item.percentage
                                ) || 0
                        )
                    )
                    : 0;


            const average =
                totalQuiz > 0
                    ? Math.round(
                        scores.reduce(
                            (
                                total,
                                item
                            ) =>
                                total +
                                (
                                    Number(
                                        item.percentage
                                    ) || 0
                                ),
                            0
                        ) / totalQuiz
                    )
                    : 0;


            const totalXP =
                scores.reduce(
                    (
                        total,
                        item
                    ) =>
                        total +
                        calculateXP(item),
                    0
                );


            document.getElementById(
                "totalQuiz"
            ).textContent =
                totalQuiz;


            document.getElementById(
                "bestScore"
            ).textContent =
                `${bestScore}%`;


            document.getElementById(
                "averageScore"
            ).textContent =
                `${average}%`;


            document.getElementById(
                "totalXP"
            ).textContent =
                totalXP;


            document.getElementById(
                "historyCount"
            ).textContent =
                `${totalQuiz} ${
                    totalQuiz > 1
                        ? "résultats"
                        : "résultat"
                }`;


            /* =================================================
               AUCUN QUIZ
            ================================================= */

            if (scores.length === 0) {

                historyList.innerHTML = `

                    <div class="empty-history">

                        <div class="empty-icon">
                            📚
                        </div>

                        <h2>
                            Aucun quiz joué
                        </h2>

                        <p>
                            Termine ton premier quiz
                            pour commencer ton historique.
                        </p>

                        <button
                            class="button button-primary"
                            onclick="startQuiz()"
                        >
                            🎯 Jouer maintenant
                        </button>

                    </div>

                `;

                return;
            }


            /* =================================================
               PLUS RÉCENT EN PREMIER
            ================================================= */

            const orderedScores =
                [...scores].sort(
                    (a, b) =>
                        new Date(
                            b.date
                        ) -
                        new Date(
                            a.date
                        )
                );


            historyList.innerHTML = "";


            /* =================================================
               AFFICHAGE
            ================================================= */

            orderedScores.forEach(
                item => {

                    const score =
                        Number(
                            item.score
                        ) || 0;


                    const total =
                        Number(
                            item.total
                        ) || 0;


                    const percentage =
                        Number(
                            item.percentage
                        ) || 0;


                    const xp =
                        item.xpGained ??
                        calculateXP(item);


                    const correctAnswers =
                        item.correctAnswers ??
                        score;


                    const quiz =
                        item.quiz ||
                        "Quiz";


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "history-item";


                    card.innerHTML = `

                        <div class="history-left">

                            <div class="quiz-icon">
                                🎯
                            </div>


                            <div class="history-info">

                                <div class="history-quiz">
                                    ${escapeHTML(
                                        quiz
                                    )}
                                </div>

                                <div class="history-date">
                                    📅 ${formatDate(
                                        item.date
                                    )}
                                </div>

                            </div>

                        </div>


                        <div class="history-details">

                            <span
                                class="badge badge-score"
                            >
                                📊 ${percentage}%
                            </span>


                            <span
                                class="badge badge-correct"
                            >
                                ✅ ${correctAnswers}
                                bonne(s)
                            </span>

                        </div>


                        <div class="history-right">

                            <div>

                                <div class="history-score">
                                    ${score} / ${total}
                                </div>

                                <div class="history-percentage">
                                    ${percentage}% de réussite
                                </div>

                            </div>


                            <div class="history-xp">
                                ⭐ +${xp} XP
                            </div>

                        </div>

                    `;


                    historyList.appendChild(
                        card
                    );

                }
            );

        } catch (error) {

            console.error(
                "Erreur historique :",
                error
            );


            historyList.innerHTML = `

                <div class="empty-history">

                    <div class="empty-icon">
                        🌐
                    </div>

                    <h2>
                        Serveur inaccessible
                    </h2>

                    <p>
                        Vérifie que ton serveur
                        Node.js est bien démarré.
                    </p>

                    <button
                        class="button button-primary"
                        onclick="loadHistory()"
                    >
                        🔄 Réessayer
                    </button>

                </div>

            `;
        }
    }



    /* =====================================================
       PROTECTION HTML
    ===================================================== */

    function escapeHTML(value) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );
    }



    /* =====================================================
       NAVIGATION
    ===================================================== */

    function goDashboard() {

        window.location.href =
            "dashboard.html";
    }


    function startQuiz() {

        window.location.href =
            "index.html";
    }



    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

        localStorage.removeItem(
            "webquiz_token"
        );

        localStorage.removeItem(
            "webquiz_user"
        );

        // Nettoyage des anciennes clés
        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "user"
        );


        window.location.href =
            "login.html";
    }



    /* =====================================================
       INITIALISATION
    ===================================================== */

    loadHistory();

</script>
